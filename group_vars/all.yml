---
# Production topology (source of truth for this playbook)
#   Dedicated master          x 3
#   Data hot                  x 6
#   Data cold                 x 5
#   ML                        x 2
#   Fleet Server              x 2
#   APM RHEL elastic-agent    x 2   (OS patch + restart)
#   APM OpenShift containers  x 2   (check-only)
#   Logstash                  x 2
#   Kibana                    x 2
# Total: 16 Elasticsearch + 10 edge inventory entries = 26
expected_topology:
  es_masters: 3
  es_data_hot: 6
  es_data_cold: 5
  es_ml: 2
  fleet: 2
  apm: 4
  apm_rhel: 2
  apm_openshift: 2
  logstash: 2
  kibana: 2
expected_es_nodes: 16          # masters + hot + cold + ml
expected_edge_nodes: 10        # fleet + apm(4) + logstash + kibana
expected_total_hosts: 26

# Cluster API endpoint used for health / allocation / ML calls.
# Point this at a VIP, load balancer, or a master that is NOT the node being rebooted
# when possible.
es_api_scheme: https
es_api_host: es-master-01.devops.local
es_api_port: 9200
es_api_user: elastic
# Prefer Ansible Vault for the password:
#   ansible-vault encrypt_string 'changeme' --name es_api_password
es_api_password: "{{ vault_es_api_password | default('changeme') }}"
es_api_validate_certs: false
es_ca_path: ""   # set to /etc/elasticsearch/certs/ca.crt if you validate TLS

# What to do on each host after OS patching
reboot_host: true                 # false = only restart the component service
reboot_timeout: 900               # seconds to wait for SSH after reboot
reboot_pre_delay: 15
skip_restart: false               # per-host/group override; apm_openshift set true

# Cluster wait
health_wait_status: green
health_timeout: 45m               # per ES node, after it has rejoined
health_poll_delay: 15             # seconds between polls
health_retries: 180               # 180 * 15s = 45 min
wait_for_no_relocating: true
wait_for_no_initializing: true

# Official rolling-restart allocation setting
# primaries  = allow primary recovery, block replica relocation while a node is down
allocation_disable_value: primaries

# Optional: pause ML jobs for the whole rolling window (recommended with only 2 ML nodes)
ml_set_upgrade_mode: true

# Optional: flush before first node (speeds local primary recovery)
do_flush: true

# Optional safety gates before starting
require_initial_green: true
fail_on_pending_tasks: false      # set true to abort if _cat/pending_tasks is non-empty
min_master_nodes_up: 3

# systemd / ports — Elasticsearch
es_service: elasticsearch
es_http_port: 9200
es_transport_port: 9300

# Fleet Server (elastic-agent running the fleet-server policy)
fleet_service: elastic-agent
fleet_port: 8220
fleet_scheme: https
fleet_status_path: /api/status
fleet_validate_certs: false

# APM via Elastic Agent (RHEL VMs and OpenShift containers share port/status).
# OpenShift hosts use skip_restart; ansible_host must be the Service/Route.
apm_service: elastic-agent
apm_port: 8200
apm_scheme: http
apm_status_path: /
apm_validate_certs: false

# Logstash
logstash_service: logstash
logstash_api_port: 9600          # node API; set 0 to skip port wait
logstash_beats_port: 5044
logstash_scheme: http
logstash_status_path: /?pretty
logstash_validate_certs: false

# Kibana
kibana_service: kibana
kibana_port: 5601
kibana_scheme: https
kibana_status_path: /api/status
kibana_validate_certs: false
